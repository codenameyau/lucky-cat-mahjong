<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playback Analysis | Lucky Cat Mahjong</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://luckycatmahjong.com/play-mahjong/">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <script>
    // Playback is a view of the game page now (?playback=1), so old links and
    // bookmarks land there. The rest of the query (sound, instant) comes along.
    (function () {
      var params = new URLSearchParams(location.search);
      params.delete('replay');
      params.set('playback', '1');
      location.replace('/play-mahjong/?' + params.toString() + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/play-mahjong/?playback=1"></noscript>
</head>
<body>
  <p><a href="/play-mahjong/?playback=1">Open the playback</a></p>
</body>
</html>
