name: Pages

# Deploys public/ to GitHub Pages (luckycatmahjong.com). The release workflow
# in the private source repo writes public/ and pushes it here.

on:
  push:
    branches:
      - master
    paths:
      - public/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload public/
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # A job of its own, so the artifact is listed by the time it deploys.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
