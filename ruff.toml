target-version = "py310"
extend-exclude = [".claude", ".cursor"]

[lint]
select = [
  "E4", "E7", "E9", "W",  # pycodestyle errors and warnings
  "F",                    # pyflakes
  "B",                    # bugbear: likely bugs
  "UP",                   # syntax Python 3.10 has a better way for
  "C4",                   # comprehensions
  "PIE",                  # unnecessary code
  "PLE",                  # pylint errors
  "ISC",                  # implicit string concatenation
  "T10",                  # debugger calls
  "LOG", "ICN",           # logging and import conventions
  "Q",                    # quotes
]
ignore = [
  "E401",   # several imports on one line
  "E701",   # a short body on the line of its if or for
  "E702",   # several statements on one line
  "E731",   # a lambda kept in a name
  "E741",   # l for a layer
  "B905",   # zip() without strict=
  "UP031",  # % formatting
  "Q003",   # " escaped inside double quotes stays double-quoted
]

[lint.per-file-ignores]
# Each arm's helpers are defined and called within its own loop pass.
"ml/lc_own_train.py" = ["B023"]

[lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
